# nginx proxy address - http://172.17.0.1:3002

name: wiki-js
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  wiki-js:
    image: requarks/wiki:latest
    pull_policy: always
    container_name: wiki-js-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - wiki-js
    ports:
      - "172.17.0.1:3002:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      DB_TYPE: postgres
      DB_HOST: wiki-js-db
      DB_PORT: 5432
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-wiki-js}
      DB_USER: ${DB_USER_NAME:-wiki-js}
      DB_PASS: ${DB_USER_PASS:-changeme_db_password}
    depends_on:
      wiki-js-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  wiki-js-db:
    image: postgres:latest
    pull_policy: always
    container_name: wiki-js-db
    restart: always
    logging: *default-logging
    networks:
      - wiki-js
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-wiki-js}
      POSTGRES_USER: ${DB_USER_NAME:-wiki-js}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/wiki-js:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  wiki-js:
    name: wiki-js
    external: false
